name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -count=1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check generated docs are up to date
        run: make docs-check
      - name: Check examples are formatted and valid
        run: make examples-check

  # Full suite, including acceptance tests, as root in a disposable container
  # (make testacc-docker), so that the user, group, chown and file_line tests
  # run instead of being skipped. The job fails if any test other than the
  # systemd ones (no systemd as PID 1 in a container) is skipped. It also
  # runs the upgrade tests from a local build of the merge base with main
  # (SYSUTILS_UPGRADE_FROM_REF=auto; see upgrade_local_acc_test.go).
  acceptance:
    name: acceptance (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Terraform release line.
          - cli: terraform
            version: '1.5'
          - cli: terraform
            version: latest
          - cli: tofu
            version: latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The upgrade tests build the provider at earlier commits: the
          # merge base with main, or the commit that added a resource.
          fetch-depth: 0
      - name: Acceptance tests (${{ matrix.cli }} ${{ matrix.version }}, root in Docker)
        run: make testacc-docker TF_CLI=${{ matrix.cli }} TF_CLI_VERSION=${{ matrix.version }} SYSUTILS_UPGRADE_FROM_REF=auto

  # The suite as root in stock Debian, Alpine and Fedora containers, for the
  # distribution-specific code paths (apt/apk/dnf, OpenRC, musl, firewall,
  # time zone and locale tools) that the Debian-based acceptance image does
  # not cover. The static test binary, the CLI and the test files are built
  # once and run in each distribution's job (make testacc-distros runs the
  # same locally). Each job fails on test failures and on skips that are not
  # expected on its distribution (see scripts/testacc-distros.sh).
  acceptance-distros-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No job below pushes, and the test containers must never see a token.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build the static test binary and download Terraform
        run: scripts/testacc-distros.sh --bundle testacc-bundle --build-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testacc-bundle
          path: testacc-bundle
          retention-days: 1

  acceptance-distros:
    name: acceptance (${{ matrix.image }})
    needs: acceptance-distros-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'alpine:latest', 'fedora:latest']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testacc-bundle
          path: testacc-bundle
      # The image reaches the shell through the environment, never through
      # expression interpolation into the script.
      - name: Acceptance tests in ${{ matrix.image }} (root in Docker)
        run: scripts/testacc-distros.sh --bundle testacc-bundle "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}

  # examples/complete end to end with the provider built from this commit:
  # init, plan, apply, a second plan that must be empty, and destroy (see
  # scripts/e2e-complete.sh). Runs directly on the runner VM as root, because
  # the stack starts a systemd unit, which needs systemd as PID 1.
  e2e:
    name: e2e examples/complete (${{ matrix.cli }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install ${{ matrix.cli }}
        run: sudo scripts/install-tf-cli.sh ${{ matrix.cli }} latest /usr/local/bin
      - name: Apply, re-plan and destroy examples/complete
        run: sudo --preserve-env=GOCACHE,GOMODCACHE,GOPATH env "PATH=$PATH" TF_CLI=${{ matrix.cli }} make e2e
        env:
          GOCACHE: /home/runner/.cache/go-build
          GOMODCACHE: /home/runner/go/pkg/mod
