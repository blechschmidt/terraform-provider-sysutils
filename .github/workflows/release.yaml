# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

# Never run two releases of the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Required repository secrets (see README.md, "Releasing"):
#   GPG_PRIVATE_KEY  ASCII-armored private key whose public key is registered
#                    with the Terraform Registry; signs the SHA256SUMS file.
#   PASSPHRASE       Passphrase of that key.
# GITHUB_TOKEN is provided by GitHub Actions.
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # A last gate before anything is published: the unit tests, and vet
      # for every architecture that .goreleaser.yml builds.
      - name: Unit tests
        run: go test ./... -count=1
      - name: Vet release architectures
        run: |
          for arch in amd64 arm64 386 arm; do
            echo "GOARCH=$arch"
            GOOS=linux GOARCH=$arch go vet ./...
          done
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Check goreleaser configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.14.3
          args: check
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.14.3
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
